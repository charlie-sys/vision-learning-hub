name: Validate learning site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build.py
      - run: python scripts/validate.py
      - run: node scripts/check_math.cjs
      - run: python scripts/check_notebooks.py
      - run: node --check assets/runner.js
      - run: node --check assets/runner-worker.js
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
      - run: python examples/course_labs.py probe --encoder tiny --dataset synthetic --train-size 40 --val-size 20 --epochs 1 --batch-size 10 --device cpu --output runs/ci-probe
